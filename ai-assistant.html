<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="和欧阳威的 AI 助手对话，了解他的经历、技能与作品。">

  <script>
    (function(){
      try {
        var t = localStorage.getItem('ow-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.dataset.theme = t;
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch(e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.cn">
  <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
  <link href="https://fonts.googleapis.cn/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=19">
  <script src="i18n.js?v=3"></script>
</head>
<body style="height:100dvh; overflow:hidden;">

  <a href="#main-content" class="skip-link" data-i18n="skip.link">跳到主要内容</a>

  <!-- ===== Header ===== -->
  <header class="site-header" role="banner">
    <div class="header-inner">
      <a class="site-logo" href="index.html" aria-label="欧阳威 — 首页">OYW</a>
      <nav class="nav-links" aria-label="主导航">
        <a class="nav-link" href="index.html" data-i18n="nav.resume">个人简历</a>
        <a class="nav-link active" href="ai-assistant.html" data-i18n="nav.ai">AI助手</a>
        <a class="nav-link" href="other.html" data-i18n="nav.other">其他</a>
        <a class="nav-link" href="contact.html" data-i18n="nav.contact">联系我</a>
      </nav>
      <div class="header-spacer"></div>
      <div class="lang-toggle" role="group" data-i18n-aria="lang.aria" aria-label="切换语言">
        <button type="button" data-lang="zh" aria-pressed="true">中</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <span class="lang-slider" aria-hidden="true"></span>
      </div>
      <button class="theme-toggle" type="button" data-i18n-aria="theme.aria" aria-label="切换明暗主题">
        <span class="theme-icon" aria-hidden="true">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.6v2.8M12 18.6v2.8M2.6 12h2.8M18.6 12h2.8M5.2 5.2l2 2M16.8 16.8l2 2M18.8 5.2l-2 2M7.2 16.8l-2 2"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
        <span class="theme-label">◐ 主题</span>
      </button>
      <button class="hamburger" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="mobile-menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <nav class="mobile-menu" id="mobile-menu" aria-label="移动端导航">
      <a href="index.html" data-i18n="nav.resume">个人简历</a>
      <a href="ai-assistant.html" class="active" data-i18n="nav.ai">AI助手</a>
      <a href="other.html" data-i18n="nav.other">其他</a>
      <a href="contact.html" data-i18n="nav.contact">联系我</a>
    </nav>
  </header>

  <div class="chat-page" id="main-content">
    <div class="wave-banner chat-banner">
      <canvas id="wave-canvas" aria-hidden="true"></canvas>
      <div class="chat-header">
        <span class="chat-kicker">AI Assistant</span>
        <h1 class="chat-title" data-i18n="chat.title">欧阳威的 AI 助手</h1>
        <p class="chat-sub" data-i18n="chat.sub">问我任何关于欧阳威的问题 —— 经历、技能、作品、竞赛</p>
      </div>
    </div>

    <div class="chat-window" role="log" aria-live="polite" aria-label="对话区域">
      <div class="chat-window-head">
        <div class="chat-avatar">AI</div>
        <div>
          <div class="chat-window-name" data-i18n="chat.name">欧阳威 · AI 助手</div>
          <div class="chat-window-status connecting" id="chat-status" data-i18n="chat.statusConn">连接中…</div>
        </div>
        <div class="header-spacer"></div>
      </div>

      <div class="chat-messages" id="chat-messages">
        <div class="msg bot">
          <div class="msg-avatar">AI</div>
          <div>
            <div class="msg-bubble" data-i18n="chat.hello">你好！我是欧阳威的 AI 助手。你可以问我关于他的教育背景、技术技能、竞赛荣誉、实习经历，或者任何关于他的问题。想从哪里开始？</div>
            <div class="msg-time" data-i18n="chat.now">现在</div>
          </div>
        </div>
      </div>

      <div class="chat-input">
        <textarea id="chat-text" rows="1" placeholder="输入你的问题…（如：他擅长什么？）" aria-label="输入消息" data-i18n-ph="chat.ph"></textarea>
        <button class="chat-send" id="chat-send" type="button" aria-label="发送" data-i18n="chat.send">发送</button>
      </div>
    </div>

    <p class="chat-hint"><span data-i18n="chat.hint">试试问：</span>
      <button type="button" data-q="他擅长哪些方面？" data-i18n="chat.q1">他擅长哪些方面？</button> ·
      <button type="button" data-q="他获得过什么竞赛奖项？" data-i18n="chat.q2">竞赛奖项</button> ·
      <button type="button" data-q="他的实习经历有哪些？" data-i18n="chat.q3">实习经历</button>
    </p>
  </div>

  <script src="script.js?v=6"></script>
  <script src="wave.js?v=8"></script>
  <script>
  /* ===== 聊天逻辑（页面专属） ===== */
  (function(){
    var messages = document.getElementById('chat-messages');
    var text = document.getElementById('chat-text');
    var sendBtn = document.getElementById('chat-send');

    var sessionId = Date.now() + '-' + Math.random().toString(36).slice(2,10);
    var API_URL = 'https://7c93621c.r7.cpolar.cn/webhook/resume-agent-chat';

    function appendMsg(role, content) {
      var isUser = role === 'user';
      var row = document.createElement('div');
      row.className = 'msg ' + role;
      var av = document.createElement('div');
      av.className = 'msg-avatar';
      av.textContent = isUser ? I18N.t('chat.user') : 'AI';
      var wrap = document.createElement('div');
      var bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = content;
      var time = document.createElement('div');
      time.className = 'msg-time';
      time.textContent = new Date().toLocaleTimeString(I18N.current() === 'en' ? 'en-US' : 'zh-CN', {hour:'2-digit', minute:'2-digit'});
      wrap.appendChild(bubble);
      wrap.appendChild(time);
      row.appendChild(av);
      row.appendChild(wrap);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
    }

    function showTyping() {
      var row = document.createElement('div');
      row.className = 'msg bot';
      row.id = 'typing-row';
      var av = document.createElement('div');
      av.className = 'msg-avatar';
      av.textContent = 'AI';
      var wrap = document.createElement('div');
      var bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      var t = document.createElement('div');
      t.className = 'typing';
      t.innerHTML = '<span></span><span></span><span></span>';
      bubble.appendChild(t);
      wrap.appendChild(bubble);
      row.appendChild(av);
      row.appendChild(wrap);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
    }

    function removeTyping() {
      var r = document.getElementById('typing-row');
      if (r) r.remove();
    }

    /* ===== 在线状态检测 ===== */
    var statusEl = document.getElementById('chat-status');
    var HEALTH_URL = API_URL.replace('/webhook/resume-agent-chat', '/webhook/health');

    function setStatus(state) {
      if (!statusEl) return;
      statusEl.classList.remove('connecting', 'online', 'offline');
      statusEl.classList.add(state);
      if (state === 'connecting') statusEl.textContent = I18N.t('chat.statusConn');
      else if (state === 'online') statusEl.textContent = I18N.t('chat.statusOn');
      else statusEl.textContent = I18N.t('chat.statusOff');
    }

    async function checkStatus() {
      var controller = new AbortController();
      var timer = setTimeout(function() { controller.abort(); }, 4000);
      try {
        var resp = await fetch(HEALTH_URL, { method:'GET', signal:controller.signal, cache:'no-store' });
        setStatus(resp.ok ? 'online' : 'offline');
      } catch(e) {
        setStatus('offline');
      } finally {
        clearTimeout(timer);
      }
    }

    setStatus('connecting');
    checkStatus();
    setInterval(checkStatus, 15000);

    /* ===== 发送消息 ===== */
    async function sendMessage() {
      var content = text.value.trim();
      if (!content || sendBtn.disabled) return;
      appendMsg('user', content);
      text.value = '';
      text.style.height = 'auto';
      sendBtn.disabled = true;
      showTyping();
      try {
        var resp = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type':'application/json' },
          body: JSON.stringify({ message: content, sessionId: sessionId })
        });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        var data = await resp.json();
        removeTyping();
        appendMsg('bot', data.reply || I18N.t('chat.noReply'));
      } catch(e) {
        removeTyping();
        appendMsg('bot', I18N.t('chat.fail'));
      }
      sendBtn.disabled = false;
      text.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    text.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    text.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 140) + 'px';
    });
    document.querySelectorAll('.chat-hint button[data-q]').forEach(function(b) {
      b.addEventListener('click', function() {
        text.value = b.getAttribute('data-q');
        sendMessage();
      });
    });
  })();
  </script>
</body>
</html>
