  <script>
  /* ===== 聊天逻辑（页面专属） ===== */
  (function(){
    var messages = document.getElementById('chat-messages');
    var text = document.getElementById('chat-text');
    var sendBtn = document.getElementById('chat-send');

    /* 后端：Cloudflare Worker（源码见 _worker/）。本地调试改成 http://127.0.0.1:8787 即可 */
    var API_BASE = 'https://api.vvosp.top';
    var API_URL = API_BASE + '/api/chat';
    var history = [];   // 多轮上下文由前端维护，服务端无状态

    function appendMsg(role, content) {
      var isUser = role === 'user';
      var row = document.createElement('div');
      row.className = 'msg ' + role;
      var av = document.createElement('div');
      av.className = 'msg-avatar';
      av.textContent = isUser ? I18N.t('chat.user') : 'AI';
      var wrap = document.createElement('div');
      var bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = content;
      var time = document.createElement('div');
      time.className = 'msg-time';
      time.textContent = new Date().toLocaleTimeString(I18N.current() === 'en' ? 'en-US' : 'zh-CN', {hour:'2-digit', minute:'2-digit'});
      wrap.appendChild(bubble);
      wrap.appendChild(time);
      row.appendChild(av);
      row.appendChild(wrap);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
    }

    /* 先插入一个带“正在输入”动画的气泡，流式内容到达时逐字填进去 */
    function createBotBubble() {
      var row = document.createElement('div');
      row.className = 'msg bot';
      var av = document.createElement('div');
      av.className = 'msg-avatar';
      av.textContent = 'AI';
      var wrap = document.createElement('div');
      var bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      var typing = document.createElement('div');
      typing.className = 'typing';
      typing.innerHTML = '<span></span><span></span><span></span>';
      bubble.appendChild(typing);
      wrap.appendChild(bubble);
      row.appendChild(av);
      row.appendChild(wrap);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
      return { wrap: wrap, bubble: bubble, typing: typing, text: '' };
    }

    function stampTime(node) {
      var time = document.createElement('div');
      time.className = 'msg-time';
      time.textContent = new Date().toLocaleTimeString(I18N.current() === 'en' ? 'en-US' : 'zh-CN', {hour:'2-digit', minute:'2-digit'});
      node.wrap.appendChild(time);
    }

    function pushChunk(node, chunk) {
      if (node.typing) { node.typing.remove(); node.typing = null; }
      node.text += chunk;
      node.bubble.textContent = node.text;
      messages.scrollTop = messages.scrollHeight;
    }

    function finishBubble(node, fallback) {
      if (node.typing) { node.typing.remove(); node.typing = null; }
      if (!node.text) node.text = fallback;
      node.bubble.textContent = node.text;
      stampTime(node);
      messages.scrollTop = messages.scrollHeight;
    }

    /* 解析 OpenAI 格式的 SSE：data: {"choices":[{"delta":{"content":"..."}}]} … data: [DONE] */
    async function consumeStream(resp, onChunk) {
      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';
      while (true) {
        var step = await reader.read();
        if (step.done) break;
        buffer += decoder.decode(step.value, { stream: true });
        var cut;
        while ((cut = buffer.indexOf('\n\n')) >= 0) {
          var frame = buffer.slice(0, cut);
          buffer = buffer.slice(cut + 2);
          var lines = frame.split('\n');
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (line.indexOf('data:') !== 0) continue;
            var payload = line.slice(5).trim();
            if (!payload || payload === '[DONE]') continue;
            try {
              var obj = JSON.parse(payload);
              var delta = obj.choices && obj.choices[0] && obj.choices[0].delta;
              if (delta && delta.content) onChunk(delta.content);
            } catch (err) { /* 不完整的帧，跳过 */ }
          }
        }
      }
    }

    /* ===== 在线状态检测 ===== */
    var statusEl = document.getElementById('chat-status');
    var HEALTH_URL = API_BASE + '/api/health';
    var statusState = 'connecting';

    function renderStatus() {
      if (!statusEl) return;
      statusEl.classList.remove('connecting', 'online', 'offline');
      statusEl.classList.add(statusState);
      var key = statusState === 'online' ? 'chat.statusOn' : (statusState === 'offline' ? 'chat.statusOff' : 'chat.statusConn');
      var fallback = statusState === 'online' ? 'Online' : (statusState === 'offline' ? 'Offline' : '连接中…');
      statusEl.textContent = (window.I18N && I18N.t) ? I18N.t(key, fallback) : fallback;
    }

    function setStatus(state) {
      statusState = state;
      renderStatus();
    }

    async function checkStatus() {
      var controller = new AbortController();
      var timer = setTimeout(function() { controller.abort(); }, 4000);
      try {
        var resp = await fetch(HEALTH_URL, { method:'GET', signal:controller.signal, cache:'no-store' });
        setStatus(resp.ok ? 'online' : 'offline');
      } catch(e) {
        setStatus('offline');
      } finally {
        clearTimeout(timer);
      }
    }

    /* i18n.js 是 defer 加载的：defer 脚本要等文档解析完才执行，而这段内联脚本在解析时就跑了。
       所以解析阶段直接调 I18N 会抛 ReferenceError，把整段聊天逻辑连根拔掉——状态灯永远停在“连接中”。
       改成等 DOMContentLoaded：defer 脚本一定早于它执行完。 */
    function startChat() {
      setStatus('connecting');
      checkStatus();
      setInterval(checkStatus, 15000);
      // 切换语言时 i18n 的 apply() 会把状态灯文字重置成“连接中…”，这里补回来
      if (window.I18N && I18N.hooks) I18N.hooks(renderStatus);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startChat);
    } else {
      startChat();
    }

    /* ===== 发送消息（流式） ===== */
    async function sendMessage() {
      var content = text.value.trim();
      if (!content || sendBtn.disabled) return;

      appendMsg('user', content);
      text.value = '';
      text.style.height = 'auto';
      sendBtn.disabled = true;

      var node = createBotBubble();

      try {
        var resp = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type':'application/json' },
          body: JSON.stringify({ message: content, history: history.slice(-8) })
        });

        if (!resp.ok) {
          var errBody = null;
          try { errBody = await resp.json(); } catch (e) {}
          throw new Error((errBody && errBody.message) || I18N.t('chat.fail'));
        }

        var type = resp.headers.get('content-type') || '';
        if (type.indexOf('text/event-stream') >= 0 && resp.body) {
          await consumeStream(resp, function (chunk) { pushChunk(node, chunk); });
          finishBubble(node, I18N.t('chat.noReply'));
        } else {
          var data = await resp.json();
          node.text = data.reply || '';
          finishBubble(node, I18N.t('chat.noReply'));
        }

        if (node.text && node.text !== I18N.t('chat.noReply')) {
          history.push({ role:'user', content: content });
          history.push({ role:'assistant', content: node.text });
          if (history.length > 16) history = history.slice(-16);
        }
        setStatus('online');
      } catch (e) {
        finishBubble(node, (e && e.message) || I18N.t('chat.fail'));
      }

      sendBtn.disabled = false;
      text.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    text.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    text.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 140) + 'px';
    });
    document.querySelectorAll('.chat-hint button[data-q]').forEach(function(b) {
      b.addEventListener('click', function() {
        text.value = b.getAttribute('data-q');
        sendMessage();
      });
    });
  })();
  </script>
