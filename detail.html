  <script>
  /* ===== 渲染详情 ===== */
  (function(){
    var params = new URLSearchParams(location.search);
    var id = params.get('id');
    var data = window.DETAILS && window.DETAILS[id];
    var root = document.getElementById('detail-content');
    var extra = document.getElementById('detail-extra');

    if (!data) {
      root.innerHTML = '<div class="detail-hero"><h1 class="detail-title">内容不存在</h1><p class="detail-summary">找不到对应的详情内容，请返回简历页。</p></div>';
      document.title = '内容不存在 — 欧阳威';
      return;
    }

    var ids = Object.keys(window.DETAILS);
    var index = ids.indexOf(id);
    var prevId = ids[index - 1];
    var nextId = ids[index + 1];

    function badgeClass(label) {
      if (label === '\u7701\u4E00') return 'award-gold';
      if (label === '\u56FD\u4E09' || label === '\u4E09\u5956') return 'award-silver';
      return 'award-bronze';
    }

    var badgeLabel = data.badge || '\u7ECF\u5386';
    var badgeCls = data.kind === 'award' ? badgeClass(badgeLabel) : 'exp';
    var heroTint = data.kind === 'award' ? badgeClass(badgeLabel).replace('award-', '') : 'exp';
    var heroIcon = data.kind === 'award' ? '\u2B50' : '\u270E';
    var highlights = data.highlights.map(function(h) { return '<li>' + h + '</li>'; }).join('');
    var details = data.details.map(function(d) { return '<li>' + d + '</li>'; }).join('');
    var skills = data.skills.map(function(s) { return '<span class="skill-tag">' + s + '</span>'; }).join('');

    root.innerHTML =
      '<div class="detail-hero tint-' + heroTint + ' reveal">' +
        '<div class="detail-hero-header">' +
          '<div>' +
            (data.badge ? '<span class="detail-badge ' + badgeCls + '">' + badgeLabel + '</span>' : '') +
            '<h1 class="detail-title"></h1>' +
            '<span class="detail-meta"></span>' +
          '</div>' +
          '<div class="detail-hero-icon">' + heroIcon + '</div>' +
        '</div>' +
        '<p class="detail-summary"></p>' +
      '</div>' +
      '<div class="detail-section reveal"><h2>\u4E3B\u8981\u6210\u679C</h2><ul>' + highlights + '</ul></div>' +
      '<div class="detail-section reveal reveal-delay-1"><h2>\u8BE6\u7EC6\u7ECF\u5386</h2><ul>' + details + '</ul></div>' +
      '<div class="detail-section reveal reveal-delay-2"><h2>\u76F8\u5173\u6280\u80FD</h2><div class="skill-tags">' + skills + '</div>' +
        '<div class="takeaway-box"><strong>\u6211\u7684\u611F\u609F</strong><p></p></div>' +
      '</div>';

    root.querySelector('.detail-title').textContent = data.title;
    root.querySelector('.detail-meta').textContent = data.meta;
    root.querySelector('.detail-summary').textContent = data.summary;
    root.querySelector('.takeaway-box p').textContent = data.takeaway;
    document.title = data.title + ' — \u6B27\u9633\u5A01';

    /* ===== 底部导航与相关推荐 ===== */
    var navHtml = '<nav class="detail-nav reveal" aria-label="详情页导航">';
    if (prevId) {
      navHtml += '<a class="detail-nav-link" href="detail.html?id=' + prevId + '">← 上一篇</a>';
    }
    if (nextId) {
      navHtml += '<a class="detail-nav-link next" href="detail.html?id=' + nextId + '">下一篇 →</a>';
    }
    navHtml += '</nav>';

    var related = [];
    if (prevId) related.push({ id: prevId, label: window.DETAILS[prevId].kind === 'award' ? '\u7ADE\u8D5B\u8363\u8A89' : '\u7ECF\u5386' });
    if (nextId) related.push({ id: nextId, label: window.DETAILS[nextId].kind === 'award' ? '\u7ADE\u8D5B\u8363\u8A89' : '\u7ECF\u5386' });

    var relatedHtml = '';
    if (related.length > 0) {
      relatedHtml = '<div class="detail-related reveal">' +
        '<h3>继续阅读</h3>' +
        '<div class="related-grid">' +
          related.map(function(r) {
            return '<a class="related-card" href="detail.html?id=' + r.id + '">' +
              '<div class="related-label">' + r.label + '</div>' +
              '<div class="related-title">' + window.DETAILS[r.id].title + '</div>' +
            '</a>';
          }).join('') +
        '</div>' +
      '</div>';
    }

    var ctaHtml = '<div class="detail-cta reveal">' +
      '<h3>\u5BF9\u8FD9\u4E9B\u5185\u5BB9\u611F\u5174\u8DA3\uFF1F</h3>' +
      '<p>\u5982\u679C\u60F3\u4E86\u89E3\u66F4\u591A\u6216\u8005\u8BA8\u8BBA\u76F8\u5173\u8BDD\u9898\uFF0C\u6B22\u8FCE\u968F\u65F6\u8054\u7CFB\u3002</p>' +
      '<a href="contact.html" class="btn btn-primary">联系我 →</a>' +
    '</div>';

    extra.innerHTML = navHtml + relatedHtml + ctaHtml;

    // Trigger reveal for dynamically added elements
    if ('IntersectionObserver' in window) {
      var newReveals = document.querySelectorAll('#detail-content .reveal, #detail-extra .reveal');
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });
      newReveals.forEach(function(el) { observer.observe(el); });
    }
  })();
  </script>
