  <script>
  /* ===== 渲染详情（支持中英切换） ===== */
  (function(){
    var params = new URLSearchParams(location.search);
    var id = params.get('id');
    var root = document.getElementById('detail-content');
    var extra = document.getElementById('detail-extra');
    var BADGE_MAP = {'\u7701\u4E00':'province1', '\u56FD\u4E09':'national3', '\u4E09\u5956':'prize3'};

    function badgeLabelFor(label) {
      if (!label) return I18N.t('badge.exp');
      var key = BADGE_MAP[label];
      return key ? I18N.t('badge.' + key, label) : label;
    }

    function renderDetail() {
      var data = window.DETAILS && window.DETAILS[id];

      if (!data) {
        root.innerHTML = '<div class="detail-hero"><h1 class="detail-title">' + I18N.t('detail.notfoundT') + '</h1><p class="detail-summary">' + I18N.t('detail.notfoundB') + '</p></div>';
        document.title = I18N.t('detail.notfoundT') + ' — OuYang Wei';
        return;
      }

      var ids = Object.keys(window.DETAILS);
      var index = ids.indexOf(id);
      var prevId = ids[index - 1];
      var nextId = ids[index + 1];

      function badgeClass(label) {
        if (label === '\u7701\u4E00') return 'award-gold';
        if (label === '\u56FD\u4E09' || label === '\u4E09\u5956') return 'award-silver';
        return 'award-bronze';
      }

      var badgeLabel = badgeLabelFor(data.badge);
      var badgeCls = data.kind === 'award' ? badgeClass(data.badge) : 'exp';
      var heroTint = data.kind === 'award' ? badgeClass(data.badge).replace('award-', '') : 'exp';
      var heroIcon = data.kind === 'award' ? '\u2B50' : '\u270E';

      var title = I18N.pickDetail(id, 'title', data.title);
      var meta = I18N.pickDetail(id, 'meta', data.meta);
      var summary = I18N.pickDetail(id, 'summary', data.summary);
      var highlights = I18N.pickDetail(id, 'highlights', data.highlights);
      var details = I18N.pickDetail(id, 'details', data.details);
      var skills = I18N.pickDetail(id, 'skills', data.skills);
      var takeaway = I18N.pickDetail(id, 'takeaway', data.takeaway);

      var highlightsHtml = highlights.map(function(h) { return '<li>' + h + '</li>'; }).join('');
      var detailsHtml = details.map(function(d) { return '<li>' + d + '</li>'; }).join('');
      var skillsHtml = skills.map(function(s) { return '<span class="skill-tag">' + s + '</span>'; }).join('');

      root.innerHTML =
        '<div class="detail-hero tint-' + heroTint + ' reveal">' +
          '<div class="detail-hero-header">' +
            '<div>' +
              (data.badge ? '<span class="detail-badge ' + badgeCls + '">' + badgeLabel + '</span>' : '') +
              '<h1 class="detail-title"></h1>' +
              '<span class="detail-meta"></span>' +
            '</div>' +
            '<div class="detail-hero-icon">' + heroIcon + '</div>' +
          '</div>' +
          '<p class="detail-summary"></p>' +
        '</div>' +
        '<div class="detail-section reveal"><h2>' + I18N.t('detail.achievements') + '</h2><ul>' + highlightsHtml + '</ul></div>' +
        '<div class="detail-section reveal reveal-delay-1"><h2>' + I18N.t('detail.details') + '</h2><ul>' + detailsHtml + '</ul></div>' +
        '<div class="detail-section reveal reveal-delay-2"><h2>' + I18N.t('detail.skills') + '</h2><div class="skill-tags">' + skillsHtml + '</div>' +
          '<div class="takeaway-box"><strong>' + I18N.t('detail.takeaway') + '</strong><p></p></div>' +
        '</div>';

      root.querySelector('.detail-title').textContent = title;
      root.querySelector('.detail-meta').textContent = meta;
      root.querySelector('.detail-summary').textContent = summary;
      root.querySelector('.takeaway-box p').textContent = takeaway;
      document.title = title + ' — OuYang Wei';

      /* 底部导航与相关推荐 */
      var navHtml = '<nav class="detail-nav reveal" aria-label="\u8BE6\u60C5\u9875\u5BFC\u822A">';
      if (prevId) navHtml += '<a class="detail-nav-link" href="detail.html?id=' + prevId + '">' + I18N.t('detail.prev') + '</a>';
      if (nextId) navHtml += '<a class="detail-nav-link next" href="detail.html?id=' + nextId + '">' + I18N.t('detail.next') + '</a>';
      navHtml += '</nav>';

      var related = [];
      if (prevId) related.push({ id: prevId, label: window.DETAILS[prevId].kind === 'award' ? I18N.t('detail.relAward') : I18N.t('detail.relExp') });
      if (nextId) related.push({ id: nextId, label: window.DETAILS[nextId].kind === 'award' ? I18N.t('detail.relAward') : I18N.t('detail.relExp') });

      var relatedHtml = '';
      if (related.length > 0) {
        relatedHtml = '<div class="detail-related reveal">' +
          '<h3>' + I18N.t('detail.related') + '</h3>' +
          '<div class="related-grid">' +
            related.map(function(r) {
              var t2 = I18N.pickDetail(r.id, 'title', window.DETAILS[r.id].title);
              return '<a class="related-card" href="detail.html?id=' + r.id + '">' +
                '<div class="related-label">' + r.label + '</div>' +
                '<div class="related-title">' + t2 + '</div>' +
              '</a>';
            }).join('') +
          '</div>' +
        '</div>';
      }

      var ctaHtml = '<div class="detail-cta reveal">' +
        '<h3>' + I18N.t('detail.ctaT') + '</h3>' +
        '<p>' + I18N.t('detail.ctaB') + '</p>' +
        '<a href="contact.html" class="btn btn-primary">' + I18N.t('detail.ctaBtn') + '</a>' +
      '</div>';

      extra.innerHTML = navHtml + relatedHtml + ctaHtml;

      // Trigger reveal for dynamically added elements
      if ('IntersectionObserver' in window) {
        var newReveals = document.querySelectorAll('#detail-content .reveal, #detail-extra .reveal');
        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); }
          });
        }, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });
        newReveals.forEach(function(el) { observer.observe(el); });
      }
    }

    if (window.I18N) {
      renderDetail();
      I18N.hooks(function(){ renderDetail(); });
    } else {
      renderDetail();
    }
  })();
  </script>
