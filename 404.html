<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面走丢了 — 欧阳威</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.cn/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
      background:radial-gradient(1200px 600px at 50% -10%, #1b2450 0%, #0b1020 60%, #070a15 100%);
      color:#eef1ff; font-family:Inter,'PingFang SC','Microsoft YaHei',system-ui,sans-serif; padding:24px; }
    .card { text-align:center; max-width:560px; }
    .code { font-size:clamp(72px,18vw,140px); font-weight:800; line-height:1;
      background:linear-gradient(135deg,#7aa2ff,#b18cff); -webkit-background-clip:text;
      background-clip:text; color:transparent; letter-spacing:-2px; }
    h1 { font-size:20px; font-weight:600; margin:8px 0 10px; }
    p { color:#a8b0cc; line-height:1.7; margin:0 0 26px; }
    a { display:inline-block; padding:12px 26px; border-radius:999px; text-decoration:none;
      color:#0b1020; background:linear-gradient(135deg,#8fb2ff,#c9a8ff); font-weight:600; }
    a:hover { filter:brightness(1.08); }
    .brand { margin-top:34px; font-size:13px; color:#6b7599; letter-spacing:2px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>这个页面不存在，或者已经被搬走了</h1>
    <p>你要找的内容可能改了名字。回首页看看，或者直接联系我。</p>
    <a href="/">返回首页</a>
    <div class="brand">vvosp.top · 欧阳威</div>
  </main>
</body>
</html>
